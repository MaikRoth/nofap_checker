<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>NoFap Streak – Buddy Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
  :root {
    color-scheme: dark;
    --bg: #020617;
    --bg-card: rgba(15, 23, 42, 0.96);
    --bg-elevated: rgba(15, 23, 42, 0.98);
    --border-subtle: rgba(148, 163, 184, 0.25);
    --accent-1: #38bdf8;
    --accent-2: #22c55e;
    --accent-3: #f97316;
    --accent-4: #a855f7;
    --text-main: #e5e7eb;
    --text-soft: #9ca3af;
    --danger: #ef4444;
    --font-main: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --radius-lg: 18px;
  }

  * {
    box-sizing: border-box;
  }
  
  body {
  margin: 0;
  min-height: 100vh;
  font-family: var(--font-main);
  color: var(--text-main);
  display: flex;
  align-items: stretch;
  justify-content: center;
  padding: 1.5rem 1rem;
  background:
    radial-gradient(circle at 0% 0%, rgba(56, 189, 248, 0.14), transparent 55%),
    radial-gradient(circle at 100% 100%, rgba(168, 85, 247, 0.14), transparent 55%),
    radial-gradient(circle at top, #020617 0, #020617 40%, #020617 100%);
  /* HIER ÄNDERN */
  overflow-y: auto;   /* oder einfach komplett entfernen */
}


  .app {
    position: relative;
    width: 100%;
    max-width: 1040px;
    background: linear-gradient(135deg, rgba(15, 23, 42, 0.96), rgba(2, 6, 23, 0.98));
    border-radius: 26px;
    border: 1px solid rgba(51, 65, 85, 0.9);
    box-shadow:
      0 26px 60px rgba(0, 0, 0, 0.85),
      0 0 0 1px rgba(15, 23, 42, 0.9);
    padding: 1.4rem 1.6rem 1.5rem;
    backdrop-filter: blur(20px);
    overflow: hidden;
    animation: app-fade-in 0.5s ease-out;
  }

  .app::before,
  .app::after {
    content: "";
    position: absolute;
    border-radius: 999px;
    filter: blur(32px);
    opacity: 0.18;
    pointer-events: none;
    mix-blend-mode: screen;
  }

  .app::before {
    width: 260px;
    height: 260px;
    top: -80px;
    right: -40px;
    background: radial-gradient(circle, rgba(56, 189, 248, 1), transparent 60%);
  }

  .app::after {
    width: 240px;
    height: 240px;
    bottom: -100px;
    left: -40px;
    background: radial-gradient(circle, rgba(34, 197, 94, 1), transparent 60%);
  }

  header {
    position: relative;
    z-index: 1;
    display: flex;
    justify-content: space-between;
    gap: 1.4rem;
    margin-bottom: 1.4rem;
    align-items: stretch;
  }

  @media (max-width: 768px) {
    header {
      flex-direction: column;
      align-items: stretch;
    }
  }

  .logo-wrap {
    display: flex;
    gap: 0.9rem;
    align-items: center;
    padding: 0.9rem 1rem;
    border-radius: 18px;
    background: radial-gradient(circle at 0 0, rgba(15, 23, 42, 0.95), rgba(2, 6, 23, 0.98));
    border: 1px solid rgba(51, 65, 85, 0.9);
    box-shadow: 0 16px 30px rgba(15, 23, 42, 0.9);
  }

  .logo {
    width: 46px;
    height: 46px;
    border-radius: 999px;
    background: conic-gradient(from 200deg, #22c55e, #0ea5e9, #1d4ed8, #a855f7, #22c55e);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.7rem;
    box-shadow:
      0 0 22px rgba(56, 189, 248, 0.8),
      0 0 40px rgba(34, 197, 94, 0.6);
    animation: logo-pulse 2.6s ease-in-out infinite;
  }

  .title-text h1 {
    margin: 0;
    font-size: 1.45rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    text-indent: 0.12em;
  }

  .title-text .tagline {
    font-size: 0.82rem;
    color: var(--text-soft);
    margin-top: 0.25rem;
    letter-spacing: 0.04em;
  }

  .subtitle {
    font-size: 0.78rem;
    color: var(--text-soft);
    margin-top: 0.35rem;
  }

  .status-block {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    align-items: flex-end;
    font-size: 0.78rem;
    padding: 0.85rem 0.9rem;
    border-radius: 18px;
    background: linear-gradient(145deg, rgba(15, 23, 42, 0.98), rgba(15, 23, 42, 0.96));
    border: 1px solid rgba(30, 64, 175, 0.7);
    box-shadow: 0 16px 32px rgba(15, 23, 42, 0.95);
    min-width: 210px;
  }

  @media (max-width: 768px) {
    .status-block {
      align-items: flex-start;
      min-width: 0;
    }
  }

  .status-row {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
  }

  .status-dot {
    width: 11px;
    height: 11px;
    border-radius: 999px;
    background: var(--danger);
    box-shadow: 0 0 12px rgba(239, 68, 68, 0.9);
  }

  .btn-reset {
    font-family: inherit;
    font-size: 0.78rem;
    padding: 0.35rem 0.85rem;
    border-radius: 999px;
    border: 1px solid rgba(248, 250, 252, 0.7);
    background: radial-gradient(circle at 0 0, #ef4444, #7f1d1d 55%);
    color: #fef2f2;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    box-shadow: 0 10px 22px rgba(127, 29, 29, 0.8);
    transition: transform 0.08s ease, box-shadow 0.08s ease, filter 0.08s ease, border-color 0.08s ease;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .btn-reset:hover {
    transform: translateY(-1px);
    filter: brightness(1.06);
    box-shadow: 0 16px 28px rgba(127, 29, 29, 0.85);
    border-color: rgba(254, 242, 242, 0.95);
  }

  .btn-reset:active {
    transform: translateY(0);
    box-shadow: 0 8px 16px rgba(127, 29, 29, 0.9);
  }

  main {
    position: relative;
    z-index: 1;
    display: grid;
    grid-template-columns: minmax(0, 2.1fr);
    gap: 1rem;
  }

  /* Summary row */

  .summary-row {
    display: grid;
    grid-template-columns: minmax(0, 1.8fr) minmax(0, 1.4fr);
    gap: 1rem;
    margin-bottom: 1rem;
  }

  @media (max-width: 920px) {
    .summary-row {
      grid-template-columns: minmax(0, 1fr);
    }
  }

  .card {
    position: relative;
    background: radial-gradient(circle at 0 0, rgba(15, 23, 42, 0.98), rgba(15, 23, 42, 0.96));
    border-radius: 20px;
    border: 1px solid rgba(51, 65, 85, 0.9);
    padding: 0.9rem 1rem;
    box-shadow: 0 18px 36px rgba(15, 23, 42, 1);
    overflow: hidden;
    transition: transform 0.16s ease, box-shadow 0.16s ease, border-color 0.16s ease, background 0.16s ease;
  }

  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 110% -10%, rgba(56, 189, 248, 0.28), transparent 60%);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.16s ease;
  }

  .card:hover {
    transform: translateY(-2px);
    box-shadow: 0 24px 46px rgba(15, 23, 42, 1);
    border-color: rgba(56, 189, 248, 0.7);
  }

  .card:hover::before {
    opacity: 1;
  }

  .card-title {
    font-size: 0.86rem;
    font-weight: 600;
    margin-bottom: 0.6rem;
    display: flex;
    align-items: center;
    gap: 0.35rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: #e5e7eb;
  }

  .card-title span:first-child {
    font-size: 0.8rem;
  }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    border-radius: 999px;
    font-size: 0.72rem;
    padding: 0.15rem 0.6rem;
    border: 1px solid rgba(148, 163, 184, 0.8);
    color: var(--text-soft);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    background: radial-gradient(circle at 0 0, rgba(15, 23, 42, 0.98), rgba(15, 23, 42, 0.96));
  }

  .overall-stats {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 0.7rem 0.9rem;
  }

  .overall-item {
    font-size: 0.82rem;
  }

  .overall-label {
    font-size: 0.76rem;
    color: var(--text-soft);
    margin-bottom: 0.15rem;
    text-transform: uppercase;
    letter-spacing: 0.09em;
  }

  .overall-value {
    font-size: 0.95rem;
    font-weight: 600;
  }

  .highlight {
    color: var(--accent-2);
  }

  .progress-bar {
    margin-top: 0.3rem;
    height: 8px;
    border-radius: 999px;
    background: rgba(15, 23, 42, 1);
    overflow: hidden;
    border: 1px solid rgba(30, 64, 175, 0.6);
  }

  .progress-inner {
    height: 100%;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
    width: 0%;
    transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .summary-note {
    margin-top: 0.7rem;
    font-size: 0.78rem;
    color: var(--text-soft);
    padding-top: 0.55rem;
    border-top: 1px dashed rgba(55, 65, 81, 0.8);
  }

  #goalProgress .overall-item {
    margin-bottom: 0.55rem;
  }

  /* Player cards */

  section .card:last-of-type {
    margin-top: 0.2rem;
  }

  .players-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 0.9rem;
  }

  @media (max-width: 768px) {
    .players-grid {
      grid-template-columns: minmax(0, 1fr);
    }
  }

  .player-card {
    border-radius: 20px;
    border: 1px solid rgba(51, 65, 85, 0.9);
    background:
      radial-gradient(circle at 0 0, rgba(56, 189, 248, 0.1), transparent 60%),
      radial-gradient(circle at 120% 120%, rgba(34, 197, 94, 0.12), transparent 55%),
      linear-gradient(150deg, rgba(15, 23, 42, 0.98), rgba(15, 23, 42, 0.97));
    padding: 0.85rem 0.95rem 0.95rem;
    display: flex;
    flex-direction: column;
    gap: 0.45rem;
    position: relative;
    overflow: hidden;
    box-shadow: 0 18px 36px rgba(15, 23, 42, 0.95);
  }

  .player-card::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(56, 189, 248, 0.18), transparent 55%);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.18s ease;
  }

  .player-card:hover::before {
    opacity: 1;
  }

  .player-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 0.7rem;
    margin-bottom: 0.1rem;
  }

  .player-name {
    font-size: 1.02rem;
    font-weight: 600;
    margin-bottom: 0.12rem;
  }

  .streak-chip {
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    border-radius: 999px;
    padding: 0.22rem 0.7rem;
    font-size: 0.76rem;
    font-weight: 600;
    border: 1px solid;
    text-transform: uppercase;
    letter-spacing: 0.12em;
  }

  .streak-chip .dot {
    width: 8px;
    height: 8px;
    border-radius: 999px;
  }

  .streak-chip.on {
    border-color: var(--accent-2);
    color: #bbf7d0;
    background: rgba(22, 163, 74, 0.18);
    box-shadow: 0 0 16px rgba(22, 163, 74, 0.4);
  }

  .streak-chip.on .dot {
    background: var(--accent-2);
    box-shadow: 0 0 10px rgba(34, 197, 94, 0.95);
  }

  .streak-chip.off {
    border-color: var(--accent-3);
    color: #fed7aa;
    background: rgba(249, 115, 22, 0.18);
    box-shadow: 0 0 16px rgba(249, 115, 22, 0.45);
  }

  .streak-chip.off .dot {
    background: var(--accent-3);
    box-shadow: 0 0 10px rgba(249, 115, 22, 0.95);
  }

  .name-input {
    width: 100%;
    margin-top: 0.18rem;
    font-size: 0.8rem;
    padding: 0.32rem 0.6rem;
    border-radius: 0.6rem;
    border: 1px solid rgba(75, 85, 99, 0.9);
    background: rgba(15, 23, 42, 0.96);
    color: var(--text-main);
    outline: none;
    transition: border-color 0.12s ease, box-shadow 0.12s ease, background 0.12s ease;
  }

  .name-input:focus {
    border-color: var(--accent-1);
    box-shadow: 0 0 0 1px rgba(56, 189, 248, 0.65);
    background: rgba(15, 23, 42, 0.98);
  }

  .stat-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 0.8rem;
    margin-top: 0.3rem;
  }

  .stat-label {
    color: var(--text-soft);
    font-size: 0.78rem;
  }

  .stat-value {
    font-weight: 500;
    font-size: 0.86rem;
  }

  .today-status {
    font-size: 0.78rem;
    color: var(--text-soft);
    margin-top: 0.16rem;
  }

  .btn-row {
    display: flex;
    flex-wrap: wrap;
    gap: 0.45rem;
    margin-top: 0.55rem;
  }

  .btn {
    font-family: inherit;
    font-size: 0.8rem;
    padding: 0.34rem 0.95rem;
    border-radius: 999px;
    border: 1px solid rgba(148, 163, 184, 0.95);
    background: radial-gradient(circle at 0 0, rgba(15, 23, 42, 1), rgba(15, 23, 42, 0.98));
    color: var(--text-main);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    box-shadow: 0 10px 20px rgba(15, 23, 42, 0.95);
    transition: transform 0.08s ease, box-shadow 0.08s ease, border-color 0.08s ease, filter 0.08s ease;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 16px 26px rgba(15, 23, 42, 1);
    border-color: var(--accent-1);
    filter: brightness(1.05);
  }

  .btn:active {
    transform: translateY(0);
    box-shadow: 0 8px 16px rgba(15, 23, 42, 1);
  }

  .btn-clean {
    border-color: var(--accent-2);
    background: radial-gradient(circle at 0 0, rgba(22, 163, 74, 0.92), rgba(15, 23, 42, 0.98));
    box-shadow: 0 14px 26px rgba(22, 163, 74, 0.45);
  }

  .btn-relapse {
    border-color: var(--accent-3);
    background: radial-gradient(circle at 0 0, rgba(248, 113, 113, 0.95), rgba(15, 23, 42, 0.98));
    box-shadow: 0 14px 26px rgba(248, 113, 113, 0.5);
  }

  .badges-section {
    margin-top: 0.7rem;
    border-top: 1px dashed rgba(55, 65, 81, 0.85);
    padding-top: 0.5rem;
  }

  .badges-title {
    font-size: 0.72rem;
    color: var(--text-soft);
    margin-bottom: 0.3rem;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    opacity: 0.9;
  }

  .badges-list {
    display: flex;
    flex-wrap: wrap;
    gap: 0.35rem;
  }

  .badge-pill {
    font-size: 0.75rem;
    padding: 0.18rem 0.6rem;
    border-radius: 999px;
    border: 1px solid;
    display: inline-flex;
    align-items: center;
    gap: 0.25rem;
    white-space: nowrap;
    position: relative;
    overflow: hidden;
  }

  .badge-pill.earned {
    border-color: var(--accent-2);
    color: #bbf7d0;
    background: linear-gradient(135deg, rgba(22, 163, 74, 0.25), rgba(22, 163, 74, 0.12));
    box-shadow: 0 0 16px rgba(34, 197, 94, 0.55);
  }

  .badge-pill.earned::after {
    content: "★";
    font-size: 0.68rem;
    opacity: 0.9;
  }

  .badge-pill.locked {
    border-color: rgba(55, 65, 81, 0.9);
    color: #6b7280;
    background: rgba(15, 23, 42, 0.96);
    opacity: 0.95;
    border-style: dashed;
  }

  .badge-pill .dot {
    width: 7px;
    height: 7px;
    border-radius: 999px;
  }

  .badge-pill.earned .dot {
    background: var(--accent-2);
    box-shadow: 0 0 8px rgba(34, 197, 94, 0.9);
  }

  .badge-pill.locked .dot {
    background: rgba(55, 65, 81, 0.9);
  }

  .relapse-note {
    font-size: 0.76rem;
    color: #fecaca;
    margin-top: 0.45rem;
    border-radius: 0.7rem;
    border: 1px dashed rgba(248, 113, 113, 0.9);
    background: radial-gradient(circle at 0 0, rgba(248, 113, 113, 0.28), rgba(15, 23, 42, 0.97));
    padding: 0.45rem 0.55rem;
  }

  .relapse-note-title {
    font-weight: 600;
    margin-bottom: 0.12rem;
  }

  .relapse-note-body {
    color: #fee2e2;
  }

  footer {
    margin-top: 0.9rem;
    font-size: 0.76rem;
    color: var(--text-soft);
    text-align: center;
    padding-top: 0.6rem;
    border-top: 1px solid rgba(30, 64, 175, 0.6);
  }

  /* Keyframes */

  @keyframes logo-pulse {
    0%, 100% {
      transform: scale(1);
      box-shadow:
        0 0 18px rgba(56, 189, 248, 0.7),
        0 0 30px rgba(34, 197, 94, 0.5);
    }
    50% {
      transform: scale(1.06);
      box-shadow:
        0 0 26px rgba(56, 189, 248, 1),
        0 0 36px rgba(34, 197, 94, 0.7);
    }
  }

  @keyframes app-fade-in {
    from {
      opacity: 0;
      transform: translateY(12px) scale(0.98);
    }
    to {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }

  /* Mobile-Finetuning */

  @media (max-width: 768px) {
    body {
      padding: 1rem 0.6rem;
    }

    .app {
      padding: 1.2rem 1.05rem 1.3rem;
      border-radius: 20px;
    }

    .title-text h1 {
      font-size: 1.26rem;
      letter-spacing: 0.16em;
    }

    .logo-wrap {
      padding: 0.8rem 0.85rem;
    }
  }


  /* Highlight card if today is marked */
.player-card.checked-today {
  border-color: var(--accent-2);
  box-shadow:
    0 0 0 1px rgba(34, 197, 94, 0.8),
    0 20px 40px rgba(22, 163, 74, 0.55);
}

/* Slightly dim cards with no check-in today */
.player-card.not-checked-today {
  opacity: 0.75;
}

/* Big vertical indicator bar on the left side */
.today-indicator {
  position: absolute;
  top: -1px;
  bottom: -1px;
  left: -1px;
  width: 5px;
  border-radius: 18px 0 0 18px;
  background: rgba(55, 65, 81, 0.9);
  box-shadow: none;
}

.today-indicator.checked {
  background: var(--accent-2);
  box-shadow: 0 0 16px rgba(34, 197, 94, 0.9);
}

/* Today status pill – much more visible */
.today-status {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  font-size: 0.78rem;
  margin-top: 0.45rem;
  padding: 0.22rem 0.7rem;
  border-radius: 999px;
  border: 1px solid transparent;
}

.today-status.checked {
  background: rgba(22, 163, 74, 0.18);
  color: #bbf7d0;
  border-color: rgba(34, 197, 94, 0.9);
  box-shadow: 0 0 12px rgba(34, 197, 94, 0.5);
}

.today-status.not-checked {
  background: rgba(15, 23, 42, 0.96);
  color: var(--text-soft);
  border-style: dashed;
  border-color: rgba(148, 163, 184, 0.8);
}
.flatline-box {
  margin-top: 0.6rem;
  padding: 0.55rem 0.7rem;
  border-radius: 14px;
  border: 1px dashed rgba(234, 179, 8, 0.9);
  background: radial-gradient(circle at 0 0, rgba(253, 224, 71, 0.18), rgba(15, 23, 42, 0.96));
  box-shadow: 0 0 22px rgba(250, 204, 21, 0.25);
  font-size: 0.78rem;
}

.flatline-title {
  font-weight: 700;
  margin-bottom: 0.2rem;
  color: #fde68a;
  display: flex;
  align-items: center;
  gap: 0.25rem;
}

.flatline-body {
  color: #fef3c7;
  opacity: 0.95;
}

.period-hint-box {
  margin-top: 0.6rem;
  padding: 0.55rem 0.7rem;
  border-radius: 14px;
  border: 1px solid rgba(59, 130, 246, 0.7);
  background: radial-gradient(circle at 0 0, rgba(59, 130, 246, 0.15), rgba(15, 23, 42, 0.96));
  box-shadow: 0 0 22px rgba(59, 130, 246, 0.25);
  font-size: 0.78rem;
}

.period-hint-title {
  font-weight: 700;
  margin-bottom: 0.2rem;
  color: #bfdbfe;
  display: flex;
  align-items: center;
  gap: 0.25rem;
}

.period-hint-body {
  color: #dbeafe;
  opacity: 0.95;
}


</style>



</head>
<body>
  <div class="app">
    <header>
      <div>
        <div class="logo-wrap">
          <div class="logo">🚫</div>
          <div class="title-text">
            <h1>NoFap Buddy Tracker</h1>
            <div class="tagline">Jeden Tag kurz checken – kein Drama, klare Zahlen.</div>
          </div>
        </div>
        <div class="subtitle" id="subtitle">Lade Stand…</div>
      </div>

      <div class="status-block">
        <div class="status-row">
          <div class="status-dot" id="statusDot"></div>
          <span id="statusLabel">Verbinde…</span>
        </div>
        <button id="resetAll" class="btn-reset">🔄 Alles zurücksetzen</button>
      </div>
    </header>

    <main>
      <section class="summary-row">
        <div class="card" id="summaryCard">
          <div class="card-title">
            <span>📊 Übersicht</span>
          </div>
          <div class="overall-stats" id="overallStats"></div>
          <div class="summary-note" id="summaryNote"></div>
        </div>

        <div class="card">
          <div class="card-title">
            <span>🎯 90-Tage-Ziel</span>
            <span class="pill">disziplin statt perfektion</span>
          </div>
          <div id="goalProgress"></div>
        </div>
      </section>

      <section>
        <div class="card">
          <div class="card-title">
            <span>👥 Eure Streaks</span>
          </div>
          <div class="players-grid" id="players"></div>
        </div>
      </section>
    </main>

    <footer id="footer"></footer>
  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

  <script>
    // === Firebase Config (deins) ===
    const firebaseConfig = {
      apiKey: "AIzaSyAVyb0c_fr9mIWW0HoCg_ZVxJAS3h9ZnXM",
      authDomain: "nofap-checker.firebaseapp.com",
      databaseURL: "https://nofap-checker-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "nofap-checker",
      storageBucket: "nofap-checker.firebasestorage.app",
      messagingSenderId: "635416357056",
      appId: "1:635416357056:web:e21753e0f76beb7668e525",
      measurementId: "G-HNWQVTZZNN"
    };
    // ================================
    const ROOM_ID = "dual-timeline-room-1";

    const DEFAULT_PLAYERS = [
      { id: "p1", name: "Maik" },
      { id: "p2", name: "Marvin" }
    ];

    // Badge-Definitionen – nur Streak, in kleineren Schritten
    const BADGES = [
      { id: "streak_1",  label: "1 Tag geschafft",      type: "streak", threshold: 1 },
      { id: "streak_3",  label: "3 Tage am Stück",      type: "streak", threshold: 3 },
      { id: "streak_5",  label: "5 Tage am Stück",      type: "streak", threshold: 5 },
      { id: "streak_7",  label: "1 Woche",              type: "streak", threshold: 7 },
      { id: "streak_10", label: "10 Tage am Stück",     type: "streak", threshold: 10 },
      { id: "streak_14", label: "2 Wochen",             type: "streak", threshold: 14 },
      { id: "streak_21", label: "3 Wochen",             type: "streak", threshold: 21 },
      { id: "streak_30", label: "30 Tage",              type: "streak", threshold: 30 },
      { id: "streak_45", label: "45 Tage",              type: "streak", threshold: 45 },
      { id: "streak_60", label: "60 Tage",              type: "streak", threshold: 60 },
      { id: "streak_75", label: "75 Tage",              type: "streak", threshold: 75 },
      { id: "streak_90", label: "90 Tage – Ziel",       type: "streak", threshold: 90 }
    ];


    let db = null;
    let state = null;
    let hasInitialLoad = false;

    function todayDateStr() {
      return new Date().toISOString().slice(0, 10);
    }

    function parseDate(str) {
      if (!str) return null;
      const d = new Date(str);
      return isNaN(d.getTime()) ? null : d;
    }

    function daysBetween(a, b) {
      if (!a || !b) return 0;
      const msPerDay = 24 * 60 * 60 * 1000;
      const start = new Date(a.getFullYear(), a.getMonth(), a.getDate()).getTime();
      const end = new Date(b.getFullYear(), b.getMonth(), b.getDate()).getTime();
      return Math.max(0, Math.round((end - start) / msPerDay));
    }

    function defaultState() {
      const today = todayDateStr();
      const players = {};
      DEFAULT_PLAYERS.forEach(p => {
        players[p.id] = {
          id: p.id,
          name: p.name,
          isOnStreak: true,
          streakStart: today,
          bestStreak: 0,
          lastRelapseDate: null,
          lastRelapseReason: "",
          lastCheckDate: null
        };
      });
      return { players };
    }

    function ensureStateShape() {
      if (!state || !state.players) {
        state = defaultState();
        return;
      }
      for (const id of Object.keys(state.players)) {
        const p = state.players[id] || {};
        if (typeof p.name !== "string") p.name = id;
        if (typeof p.isOnStreak !== "boolean") p.isOnStreak = true;
        if (!p.streakStart) p.streakStart = todayDateStr();
        if (typeof p.bestStreak !== "number") p.bestStreak = 0;
        if (p.lastRelapseDate === undefined) p.lastRelapseDate = null;
        if (p.lastRelapseReason === undefined) p.lastRelapseReason = "";
        if (p.lastCheckDate === undefined) p.lastCheckDate = null;
        state.players[id] = p;
      }
      DEFAULT_PLAYERS.forEach(dp => {
        if (!state.players[dp.id]) {
          state.players[dp.id] = {
            id: dp.id,
            name: dp.name,
            isOnStreak: true,
            streakStart: todayDateStr(),
            bestStreak: 0,
            lastRelapseDate: null,
            lastRelapseReason: "",
            lastCheckDate: null
          };
        }
      });
    }


    function getPeriodHint(player) {
  const d = currentStreakDays(player);

  if (d <= 3) {
    return {
      title: "🚀 Startphase",
      text:
        "Häufige Effekte: starker Drang, Nervosität, Reizbarkeit, viel Energie im Kopf. " +
        "Tipp: Struktur, Bewegung und genug Schlaf helfen enorm."
    };
  }

  if (d <= 7) {
    return {
      title: "🔥 Entzugsphase (erste Woche)",
      text:
        "Typisch: Stimmungsschwankungen, unruhiger Schlaf, mehr Gedanken an Sex/Porn. " +
        "Das ist dein Gehirn, das alte Gewohnheiten loslässt."
    };
  }

  if (d <= 14) {
    return {
      title: "⚖️ Anpassungsphase (Woche 2)",
      text:
        "Viele berichten von mehr Energie, aber emotionalem Chaos. " +
        "Routine hilft jetzt sehr – Training, Kälte, soziale Kontakte."
    };
  }

  if (d <= 24) {
    return {
      title: "⚠️ Mögliche Flatline-Phase",
      text:
        "Wenig Lust, weniger Motivation oder ‚emotional flach‘? Das ist normal. " +
        "Dein Gehirn reguliert Dopamin-Sensitivität. Das geht vorbei."
    };
  }

  if (d <= 35) {
    return {
      title: "💪 Stabilisierung beginnt",
      text:
        "Mehr Klarheit im Kopf, bessere Konzentration und weniger Zwangsdrang sind häufig. " +
        "Jetzt ist die Gefahr: ‚Ich hab’s im Griff, ich kann ja kurz…‘ – bleib dran."
    };
  }

  if (d <= 50) {
    return {
      title: "🏃‍♂️ Neue Gewohnheiten bilden sich",
      text:
        "Dein Gehirn gewöhnt sich an das Leben ohne ständige Stimulation. " +
        "Viele erleben bessere Stimmung, Produktivität und Sozialkontakt."
    };
  }

  return {
    title: "👑 Long-Streak-Phase",
    text:
      "Die meisten profitieren jetzt von mehr Selbstvertrauen, Ruhe und Fokus. " +
      "Bleib wachsam: Trigger meiden, Ziele im Blick behalten."
  };
}

    function currentStreakDays(player) {
      if (!player.isOnStreak || !player.streakStart) return 0;
      const start = parseDate(player.streakStart);
      const today = new Date();
      return daysBetween(start, today) + 1;
    }

    function lastRelapseLabel(player) {
      if (!player.lastRelapseDate) return "Kein Rückfall gespeichert 🙌";
      const d = parseDate(player.lastRelapseDate);
      if (!d) return "Datum unbekannt";
      const today = new Date();
      const daysAgo = daysBetween(d, today);
      const dateStr = d.toLocaleDateString();
      if (daysAgo === 0) return `Heute (${dateStr})`;
      if (daysAgo === 1) return `Gestern (${dateStr})`;
      return `${daysAgo} Tag(e) her (${dateStr})`;
    }

    function todayChecked(player) {
      return player.lastCheckDate === todayDateStr();
    }

    function updateStatus(connected) {
      const dot = document.getElementById("statusDot");
      const label = document.getElementById("statusLabel");
      if (!dot || !label) return;
      if (!connected) {
        dot.style.background = "#f97316";
        dot.style.boxShadow = "0 0 10px rgba(249,115,22,0.9)";
        label.textContent = "Verbinde…";
      } else {
        dot.style.background = "#22c55e";
        dot.style.boxShadow = "0 0 10px rgba(34,197,94,0.9)";
        label.textContent = "Live verbunden";
      }
    }

    function saveState() {
      if (!db || !hasInitialLoad) return;
      const ref = db.ref("nofapRooms/" + ROOM_ID);
      ref.set(state).catch(err => console.error("Fehler beim Speichern:", err));
    }

    function handleCheckClean(playerId) {
      const p = state.players[playerId];
      if (!p) return;
      const today = todayDateStr();

      if (!p.isOnStreak) {
        p.isOnStreak = true;
        p.streakStart = today;
      } else if (!p.streakStart) {
        p.streakStart = today;
      }

      p.lastCheckDate = today;
      saveState();
      renderAll();
    }

    function isInFlatlineWindow(player) {
  const days = currentStreakDays(player);

  // typischer Erfahrungswertbereiche
  const windows = [
    { from: 14, to: 24 }, // Woche 3 herum
    { from: 38, to: 48 }  // ca. Woche 6
  ];

  return windows.some(w => days >= w.from && days <= w.to);
}

    function handleRelapse(playerId) {
      const p = state.players[playerId];
      if (!p) return;
      const today = todayDateStr();
      const reason = window.prompt(
        `Was war der Grund für den Rückfall bei ${p.name}? (optional)`,
        p.lastRelapseReason || ""
      );
      if (reason === null) return;

      let streakLen = 0;
      if (p.isOnStreak && p.streakStart) {
        const start = parseDate(p.streakStart);
        if (start) {
          const yesterday = new Date();
          yesterday.setDate(yesterday.getDate() - 1);
          streakLen = daysBetween(start, yesterday) + 1;
        }
      }
      if (streakLen > p.bestStreak) p.bestStreak = streakLen;

      p.isOnStreak = false;
      p.lastRelapseDate = today;
      p.lastRelapseReason = reason.trim();
      p.lastCheckDate = today;

      saveState();
      renderAll();
    }


    function handleResetAll() {
      if (!window.confirm("Wirklich alle Daten für euch beide zurücksetzen?")) return;
      state = defaultState();
      saveState();
      renderAll();
    }

    // Badges

    function getBadgesForPlayer(player) {
  const current = currentStreakDays(player);

  return BADGES.map(b => {
    const earned = current >= b.threshold;
    return { ...b, earned };
  });
}

    // Rendering

    function renderSummary() {
      const overallContainer = document.getElementById("overallStats");
      const note = document.getElementById("summaryNote");
      const goalProgress = document.getElementById("goalProgress");
      if (!overallContainer || !note || !goalProgress) return;

      overallContainer.innerHTML = "";
      goalProgress.innerHTML = "";

      const players = Object.values(state.players || {});
      if (players.length === 0) return;

      // Übersicht pro Person
      players.forEach(p => {
        const current = currentStreakDays(p);
        const wrap = document.createElement("div");
        wrap.className = "overall-item";

        const label = document.createElement("div");
        label.className = "overall-label";
        label.textContent = p.name;

        const value = document.createElement("div");
        value.className = "overall-value";
        value.innerHTML = `<span class="highlight">${current}</span> Tage · Rekord ${p.bestStreak} Tage`;

        wrap.appendChild(label);
        wrap.appendChild(value);
        overallContainer.appendChild(wrap);
      });

      // Vergleich-Satz
      if (players.length === 2) {
        const [a, b] = players;
        const aStreak = currentStreakDays(a);
        const bStreak = currentStreakDays(b);
        const aBest = a.bestStreak || 0;
        const bBest = b.bestStreak || 0;
        let text = "";

        if (aStreak > bStreak) {
          text += `👑 Aktuell vorne: ${a.name} (${aStreak} vs. ${bStreak} Tage). `;
        } else if (bStreak > aStreak) {
          text += `👑 Aktuell vorne: ${b.name} (${bStreak} vs. ${aStreak} Tage). `;
        } else {
          text += `🤝 Gleichstand – beide ${aStreak} Tage. `;
        }

        if (aBest > bBest) {
          text += `Rekordhalter: ${a.name} mit ${aBest} Tagen.`;
        } else if (bBest > aBest) {
          text += `Rekordhalter: ${b.name} mit ${bBest} Tagen.`;
        } else {
          text += `Eure Rekorde sind gleich hoch (${aBest} Tage).`;
        }

        note.textContent = text;
      } else {
        note.textContent = "Checkt einfach jeden Tag einmal kurz ein. Konstanz > Perfektion.";
      }

      // 90-Tage-Balken pro Person
      players.forEach(p => {
        const current = currentStreakDays(p);
        const percent = Math.max(0, Math.min(100, (current / 90) * 100));

        const block = document.createElement("div");
        block.className = "overall-item";
        block.style.marginBottom = "0.4rem";

        const label = document.createElement("div");
        label.className = "overall-label";
        label.textContent = `${p.name} – ${current}/90 Tage`;

        const bar = document.createElement("div");
        bar.className = "progress-bar";
        const inner = document.createElement("div");
        inner.className = "progress-inner";
        inner.style.width = percent.toFixed(1) + "%";
        bar.appendChild(inner);

        block.appendChild(label);
        block.appendChild(bar);
        goalProgress.appendChild(block);
      });
    }

    function renderPlayers() {
      const container = document.getElementById("players");
      if (!container) return;
      container.innerHTML = "";

      const players = Object.values(state.players || {});
      players.forEach(p => {
  const current = currentStreakDays(p);
  const checkedToday = todayChecked(p);

  const card = document.createElement("div");
  card.className = "player-card " + (checkedToday ? "checked-today" : "not-checked-today");

  // vertical indicator bar
  const indicator = document.createElement("div");
  indicator.className = "today-indicator" + (checkedToday ? " checked" : "");
  card.appendChild(indicator);

  const header = document.createElement("div");
  header.className = "player-header";

  const leftHeader = document.createElement("div");
  const name = document.createElement("div");
  name.className = "player-name";
  name.textContent = p.name;
  leftHeader.appendChild(name);

  const chip = document.createElement("div");
  chip.className = "streak-chip " + (p.isOnStreak ? "on" : "off");
  const dot = document.createElement("span");
  dot.className = "dot";
  const label = document.createElement("span");
  label.textContent = p.isOnStreak ? "auf Streak" : "Reset – neuer Start";

  chip.appendChild(dot);
  chip.appendChild(label);

  header.appendChild(leftHeader);
  header.appendChild(chip);
  card.appendChild(header);

  const stat1 = document.createElement("div");
  stat1.className = "stat-row";
  stat1.innerHTML = `<div class="stat-label">Aktuelle Streak</div><div class="stat-value">${current} Tag(e)</div>`;
  card.appendChild(stat1);

  const stat2 = document.createElement("div");
  stat2.className = "stat-row";
  stat2.innerHTML = `<div class="stat-label">Bester Rekord</div><div class="stat-value">${p.bestStreak} Tag(e)</div>`;
  card.appendChild(stat2);

  const stat3 = document.createElement("div");
  stat3.className = "stat-row";
  stat3.innerHTML = `<div class="stat-label">Letzter Rückfall</div><div class="stat-value">${lastRelapseLabel(p)}</div>`;
  card.appendChild(stat3);

  // === Zeitraum-Hinweis einbauen ===
const hint = getPeriodHint(p);
if (hint) {
  const box = document.createElement("div");
  box.className = "period-hint-box";

  const title = document.createElement("div");
  title.className = "period-hint-title";
  title.textContent = hint.title;

  const body = document.createElement("div");
  body.className = "period-hint-body";
  body.textContent = hint.text;

  box.appendChild(title);
  box.appendChild(body);
  card.appendChild(box);
}

  // >>> this part changed <<<
  const todayLine = document.createElement("div");
  todayLine.className = "today-status " + (checkedToday ? "checked" : "not-checked");
  todayLine.textContent = checkedToday
    ? "✅ Heute markiert"
    : "⏱️ Noch kein Check-in heute";
  card.appendChild(todayLine);
  // >>> end changed part <<<

  const btnRow = document.createElement("div");
  btnRow.className = "btn-row";

  const btnClean = document.createElement("button");
  btnClean.className = "btn btn-clean";
  btnClean.textContent = "✅ Heute clean";
  btnClean.addEventListener("click", () => handleCheckClean(p.id));

  const btnRelapse = document.createElement("button");
  btnRelapse.className = "btn btn-relapse";
  btnRelapse.textContent = "💥 Heute Rückfall";
  btnRelapse.addEventListener("click", () => handleRelapse(p.id));

  btnRow.appendChild(btnClean);
  btnRow.appendChild(btnRelapse);
  card.appendChild(btnRow);

  // === Flatline Hinweis ===
if (isInFlatlineWindow(p)) {
  const box = document.createElement("div");
  box.className = "flatline-box";

  const title = document.createElement("div");
  title.className = "flatline-title";
  title.innerHTML = "⚠️ Mögliche Flatline-Phase";

  const body = document.createElement("div");
  body.className = "flatline-body";
  body.innerHTML =
    "Wenn du dich gerade müde, emotionslos oder ohne Lust fühlst: Das ist typisch in dieser Phase. " +
    "Dein Gehirn passt sich an weniger Dopamin-Stimulation an. " +
    "Bleib ruhig, trainiere, schlafe gut – das geht vorbei. 💪";

  box.appendChild(title);
  box.appendChild(body);
  card.appendChild(box);
}

  // Badges
  const badgesWrap = document.createElement("div");
  badgesWrap.className = "badges-section";

  const badgesTitle = document.createElement("div");
  badgesTitle.className = "badges-title";
  badgesTitle.textContent = "Badges (Streak)";
  badgesWrap.appendChild(badgesTitle);

  const badgesList = document.createElement("div");
  badgesList.className = "badges-list";

  const badges = getBadgesForPlayer(p);
  badges.forEach(b => {
    const pill = document.createElement("div");
    pill.className = "badge-pill " + (b.earned ? "earned" : "locked");
    const dotBadge = document.createElement("span");
    dotBadge.className = "dot";
    const txt = document.createElement("span");
    txt.textContent = b.label;
    pill.appendChild(dotBadge);
    pill.appendChild(txt);
    badgesList.appendChild(pill);
  });

  badgesWrap.appendChild(badgesList);
  card.appendChild(badgesWrap);

  if (p.lastRelapseDate || p.lastRelapseReason) {
    const note = document.createElement("div");
    note.className = "relapse-note";
    const title = document.createElement("div");
    title.className = "relapse-note-title";
    title.textContent = "Notiz zum letzten Rückfall";
    const body = document.createElement("div");
    body.className = "relapse-note-body";
    body.textContent = p.lastRelapseReason || "Kein Grund eingetragen.";
    note.appendChild(title);
    note.appendChild(body);
    card.appendChild(note);
  }

  container.appendChild(card);
});

    }

    function renderMeta() {
      const subtitle = document.getElementById("subtitle");
      const footer = document.getElementById("footer");
      const now = new Date();
      if (subtitle) {
        subtitle.textContent = `Stand: ${now.toLocaleString()}`;
      }
      if (footer) {
        footer.textContent = "Ziel: 90 Tage. Wenn ein Rückfall passiert: ruhig resetten und weiter machen.";
      }
    }

    function renderAll() {
      ensureStateShape();
      renderSummary();
      renderPlayers();
      renderMeta();
      updateStatus(hasInitialLoad);
    }

    function initFirebase() {
      try {
        firebase.initializeApp(firebaseConfig);
        db = firebase.database();
      } catch (e) {
        console.error("Firebase Init Fehler:", e);
        updateStatus(false);
        return;
      }

      const ref = db.ref("nofapRooms/" + ROOM_ID);
      ref.on(
        "value",
        snapshot => {
          if (!snapshot.exists()) {
            state = defaultState();
            ensureStateShape();
            hasInitialLoad = true;
            saveState();
            renderAll();
            return;
          }
          state = snapshot.val();
          ensureStateShape();
          hasInitialLoad = true;
          renderAll();
        },
        err => {
          console.error("Fehler beim Lesen von Firebase:", err);
          hasInitialLoad = false;
          updateStatus(false);
        }
      );
    }

    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("resetAll")?.addEventListener("click", handleResetAll);
      renderMeta();
      initFirebase();
    });
  </script>
</body>
