<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>NoFap Streak – Buddy Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #020617;
      --bg-card: #020617;
      --bg-elevated: #020617;
      --border-subtle: rgba(148, 163, 184, 0.35);
      --accent-1: #38bdf8;
      --accent-2: #22c55e;
      --accent-3: #f97316;
      --text-main: #e5e7eb;
      --text-soft: #9ca3af;
      --danger: #ef4444;
      --font-main: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --radius-lg: 18px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top, #0f172a 0, #020617 45%, #020617 100%);
      font-family: var(--font-main);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem 1rem;
    }

    .app {
      width: 100%;
      max-width: 960px;
      background: rgba(15, 23, 42, 0.96);
      border-radius: 20px;
      border: 1px solid rgba(30, 64, 175, 0.35);
      box-shadow: 0 24px 50px rgba(0, 0, 0, 0.8);
      padding: 1.2rem 1.1rem 1.4rem;
    }

    header {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1rem;
      align-items: center;
    }

    @media (max-width: 720px) {
      header {
        flex-direction: column;
        align-items: flex-start;
      }
    }

    .logo-wrap {
      display: flex;
      gap: 0.8rem;
      align-items: center;
    }

    .logo {
      width: 42px;
      height: 42px;
      border-radius: 999px;
      background: radial-gradient(circle at 30% 0, #22c55e, #0ea5e9 45%, #1d4ed8 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
    }

    .title-text h1 {
      margin: 0;
      font-size: 1.4rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .title-text .tagline {
      font-size: 0.8rem;
      color: var(--text-soft);
      margin-top: 0.15rem;
    }

    .subtitle {
      font-size: 0.8rem;
      color: var(--text-soft);
      margin-top: 0.25rem;
    }

    .status-block {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      align-items: flex-end;
      font-size: 0.78rem;
    }

    @media (max-width: 720px) {
      .status-block {
        align-items: flex-start;
      }
    }

    .status-row {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: var(--danger);
      box-shadow: 0 0 10px rgba(239, 68, 68, 0.9);
    }

    .btn-reset {
      font-family: inherit;
      font-size: 0.78rem;
      padding: 0.3rem 0.8rem;
      border-radius: 999px;
      border: 1px solid rgba(248, 250, 252, 0.6);
      background: radial-gradient(circle at top, #ef4444, #7f1d1d);
      color: #fef2f2;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      box-shadow: 0 10px 18px rgba(127, 29, 29, 0.7);
      transition: transform 0.07s ease, box-shadow 0.07s ease, filter 0.07s ease;
    }

    .btn-reset:hover {
      transform: translateY(-1px);
      filter: brightness(1.05);
      box-shadow: 0 16px 26px rgba(127, 29, 29, 0.8);
    }

    .btn-reset:active {
      transform: translateY(0);
      box-shadow: 0 8px 16px rgba(127, 29, 29, 0.8);
    }

    /* Summary row */

    .summary-row {
      display: grid;
      grid-template-columns: minmax(0, 2.2fr) minmax(0, 1.8fr);
      gap: 0.9rem;
      margin-bottom: 1rem;
    }

    @media (max-width: 900px) {
      .summary-row {
        grid-template-columns: minmax(0, 1fr);
      }
    }

    .card {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-subtle);
      padding: 0.8rem 0.9rem;
      box-shadow: 0 18px 32px rgba(15, 23, 42, 0.9);
    }

    .card-title {
      font-size: 0.88rem;
      font-weight: 600;
      margin-bottom: 0.55rem;
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      border-radius: 999px;
      font-size: 0.75rem;
      padding: 0.12rem 0.5rem;
      border: 1px solid rgba(148, 163, 184, 0.7);
      color: var(--text-soft);
    }

    .overall-stats {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.6rem;
    }

    .overall-item {
      font-size: 0.82rem;
    }

    .overall-label {
      font-size: 0.76rem;
      color: var(--text-soft);
      margin-bottom: 0.1rem;
    }

    .overall-value {
      font-size: 0.9rem;
      font-weight: 500;
    }

    .highlight {
      color: var(--accent-2);
    }

    .progress-bar {
      margin-top: 0.3rem;
      height: 7px;
      border-radius: 999px;
      background: rgba(31, 41, 55, 0.95);
      overflow: hidden;
    }

    .progress-inner {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(to right, var(--accent-1), var(--accent-2));
      width: 0%;
      transition: width 0.25s ease-out;
    }

    .summary-note {
      margin-top: 0.4rem;
      font-size: 0.78rem;
      color: var(--text-soft);
    }

    /* Player cards */

    .players-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.9rem;
    }

    @media (max-width: 720px) {
      .players-grid {
        grid-template-columns: minmax(0, 1fr);
      }
    }

    .player-card {
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-subtle);
      background: radial-gradient(circle at top, rgba(15, 23, 42, 0.98), rgba(15, 23, 42, 0.95));
      padding: 0.8rem 0.9rem 0.9rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .player-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
    }

    .player-name {
      font-size: 1rem;
      font-weight: 600;
    }

    .streak-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      border-radius: 999px;
      padding: 0.18rem 0.6rem;
      font-size: 0.75rem;
      font-weight: 600;
      border: 1px solid;
    }

    .streak-chip .dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
    }

    .streak-chip.on {
      border-color: var(--accent-2);
      color: #bbf7d0;
      background: rgba(22, 163, 74, 0.15);
    }

    .streak-chip.on .dot {
      background: var(--accent-2);
      box-shadow: 0 0 8px rgba(34, 197, 94, 0.9);
    }

    .streak-chip.off {
      border-color: var(--accent-3);
      color: #fed7aa;
      background: rgba(249, 115, 22, 0.12);
    }

    .streak-chip.off .dot {
      background: var(--accent-3);
      box-shadow: 0 0 8px rgba(249, 115, 22, 0.9);
    }

    .name-input {
      width: 100%;
      margin-top: 0.15rem;
      font-size: 0.8rem;
      padding: 0.3rem 0.55rem;
      border-radius: 0.55rem;
      border: 1px solid rgba(75, 85, 99, 0.9);
      background: rgba(15, 23, 42, 0.96);
      color: var(--text-main);
      outline: none;
    }

    .name-input:focus {
      border-color: var(--accent-1);
      box-shadow: 0 0 0 1px rgba(56, 189, 248, 0.6);
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 0.8rem;
      margin-top: 0.18rem;
    }

    .stat-label {
      color: var(--text-soft);
      font-size: 0.78rem;
    }

    .stat-value {
      font-weight: 500;
      font-size: 0.84rem;
    }

    .today-status {
      font-size: 0.78rem;
      color: var(--text-soft);
      margin-top: 0.1rem;
    }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-top: 0.5rem;
    }

    .btn {
      font-family: inherit;
      font-size: 0.8rem;
      padding: 0.3rem 0.8rem;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.9);
      background: radial-gradient(circle at top, rgba(15, 23, 42, 1), rgba(15, 23, 42, 0.96));
      color: var(--text-main);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      box-shadow: 0 10px 18px rgba(15, 23, 42, 0.9);
      transition: transform 0.06s ease, box-shadow 0.06s ease, border-color 0.06s ease, filter 0.06s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 16px 26px rgba(15, 23, 42, 0.9);
      border-color: var(--accent-1);
      filter: brightness(1.03);
    }

    .btn:active {
      transform: translateY(0);
      box-shadow: 0 8px 14px rgba(15, 23, 42, 0.9);
    }

    .btn-clean {
      border-color: var(--accent-2);
      background: radial-gradient(circle at top left, rgba(22, 163, 74, 0.9), rgba(15, 23, 42, 0.96));
    }

    .btn-relapse {
      border-color: #f97316;
      background: radial-gradient(circle at top left, rgba(248, 113, 113, 0.95), rgba(15, 23, 42, 0.96));
    }

    .badges-section {
      margin-top: 0.4rem;
      border-top: 1px dashed rgba(55, 65, 81, 0.8);
      padding-top: 0.4rem;
    }

    .badges-title {
      font-size: 0.76rem;
      color: var(--text-soft);
      margin-bottom: 0.25rem;
    }

    .badges-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
    }

    .badge-pill {
      font-size: 0.75rem;
      padding: 0.16rem 0.55rem;
      border-radius: 999px;
      border: 1px solid;
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      white-space: nowrap;
    }

    .badge-pill.earned {
      border-color: var(--accent-2);
      color: #bbf7d0;
      background: rgba(22, 163, 74, 0.14);
    }

    .badge-pill.locked {
      border-color: rgba(55, 65, 81, 0.9);
      color: #6b7280;
      background: rgba(15, 23, 42, 0.9);
      opacity: 0.9;
    }

    .badge-pill .dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
    }

    .badge-pill.earned .dot {
      background: var(--accent-2);
      box-shadow: 0 0 8px rgba(34, 197, 94, 0.8);
    }

    .badge-pill.locked .dot {
      background: rgba(55, 65, 81, 0.9);
    }

    .relapse-note {
      font-size: 0.76rem;
      color: #fecaca;
      margin-top: 0.35rem;
      border-radius: 0.6rem;
      border: 1px dashed rgba(248, 113, 113, 0.9);
      background: radial-gradient(circle at 0 0, rgba(248, 113, 113, 0.28), rgba(15, 23, 42, 0.96));
      padding: 0.4rem 0.5rem;
    }

    .relapse-note-title {
      font-weight: 600;
      margin-bottom: 0.1rem;
    }

    .relapse-note-body {
      color: #fee2e2;
    }

    footer {
      margin-top: 0.7rem;
      font-size: 0.75rem;
      color: var(--text-soft);
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div>
        <div class="logo-wrap">
          <div class="logo">🚫</div>
          <div class="title-text">
            <h1>NoFap Buddy Tracker</h1>
            <div class="tagline">Jeden Tag kurz checken – kein Drama, klare Zahlen.</div>
          </div>
        </div>
        <div class="subtitle" id="subtitle">Lade Stand…</div>
      </div>

      <div class="status-block">
        <div class="status-row">
          <div class="status-dot" id="statusDot"></div>
          <span id="statusLabel">Verbinde…</span>
        </div>
        <button id="resetAll" class="btn-reset">🔄 Alles zurücksetzen</button>
      </div>
    </header>

    <main>
      <section class="summary-row">
        <div class="card" id="summaryCard">
          <div class="card-title">
            <span>📊 Übersicht</span>
          </div>
          <div class="overall-stats" id="overallStats"></div>
          <div class="summary-note" id="summaryNote"></div>
        </div>

        <div class="card">
          <div class="card-title">
            <span>🎯 90-Tage-Ziel</span>
            <span class="pill">disziplin statt perfektion</span>
          </div>
          <div id="goalProgress"></div>
        </div>
      </section>

      <section>
        <div class="card">
          <div class="card-title">
            <span>👥 Eure Streaks</span>
          </div>
          <div class="players-grid" id="players"></div>
        </div>
      </section>
    </main>

    <footer id="footer"></footer>
  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

  <script>
    // === Firebase Config (deins) ===
    const firebaseConfig = {
      apiKey: "AIzaSyAVyb0c_fr9mIWW0HoCg_ZVxJAS3h9ZnXM",
      authDomain: "nofap-checker.firebaseapp.com",
      databaseURL: "https://nofap-checker-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "nofap-checker",
      storageBucket: "nofap-checker.firebasestorage.app",
      messagingSenderId: "635416357056",
      appId: "1:635416357056:web:e21753e0f76beb7668e525",
      measurementId: "G-HNWQVTZZNN"
    };
    // ================================
    const ROOM_ID = "dual-timeline-room-1";

    const DEFAULT_PLAYERS = [
      { id: "p1", name: "Maik" },
      { id: "p2", name: "Marvin" }
    ];

    // Badge-Definitionen
    const BADGES = [
      { id: "streak_3",   label: "3 Tage am Stück",  type: "streak", threshold: 3 },
      { id: "streak_7",   label: "1 Woche",          type: "streak", threshold: 7 },
      { id: "streak_14",  label: "2 Wochen",         type: "streak", threshold: 14 },
      { id: "streak_30",  label: "30 Tage",          type: "streak", threshold: 30 },
      { id: "streak_60",  label: "60 Tage",          type: "streak", threshold: 60 },
      { id: "streak_90",  label: "90 Tage",          type: "streak", threshold: 90 },
      { id: "best_30",    label: "Rekord 30+",       type: "best",   threshold: 30 },
      { id: "best_60",    label: "Rekord 60+",       type: "best",   threshold: 60 },
      { id: "bounce_back",label: "Stärker zurück",   type: "bounce", threshold: 1 } // wird speziell geprüft
    ];

    let db = null;
    let state = null;
    let hasInitialLoad = false;

    function todayDateStr() {
      return new Date().toISOString().slice(0, 10);
    }

    function parseDate(str) {
      if (!str) return null;
      const d = new Date(str);
      return isNaN(d.getTime()) ? null : d;
    }

    function daysBetween(a, b) {
      if (!a || !b) return 0;
      const msPerDay = 24 * 60 * 60 * 1000;
      const start = new Date(a.getFullYear(), a.getMonth(), a.getDate()).getTime();
      const end = new Date(b.getFullYear(), b.getMonth(), b.getDate()).getTime();
      return Math.max(0, Math.round((end - start) / msPerDay));
    }

    function defaultState() {
      const today = todayDateStr();
      const players = {};
      DEFAULT_PLAYERS.forEach(p => {
        players[p.id] = {
          id: p.id,
          name: p.name,
          isOnStreak: true,
          streakStart: today,
          bestStreak: 0,
          lastRelapseDate: null,
          lastRelapseReason: "",
          lastCheckDate: null
        };
      });
      return { players };
    }

    function ensureStateShape() {
      if (!state || !state.players) {
        state = defaultState();
        return;
      }
      for (const id of Object.keys(state.players)) {
        const p = state.players[id] || {};
        if (typeof p.name !== "string") p.name = id;
        if (typeof p.isOnStreak !== "boolean") p.isOnStreak = true;
        if (!p.streakStart) p.streakStart = todayDateStr();
        if (typeof p.bestStreak !== "number") p.bestStreak = 0;
        if (p.lastRelapseDate === undefined) p.lastRelapseDate = null;
        if (p.lastRelapseReason === undefined) p.lastRelapseReason = "";
        if (p.lastCheckDate === undefined) p.lastCheckDate = null;
        state.players[id] = p;
      }
      DEFAULT_PLAYERS.forEach(dp => {
        if (!state.players[dp.id]) {
          state.players[dp.id] = {
            id: dp.id,
            name: dp.name,
            isOnStreak: true,
            streakStart: todayDateStr(),
            bestStreak: 0,
            lastRelapseDate: null,
            lastRelapseReason: "",
            lastCheckDate: null
          };
        }
      });
    }

    function currentStreakDays(player) {
      if (!player.isOnStreak || !player.streakStart) return 0;
      const start = parseDate(player.streakStart);
      const today = new Date();
      return daysBetween(start, today) + 1;
    }

    function lastRelapseLabel(player) {
      if (!player.lastRelapseDate) return "Kein Rückfall gespeichert 🙌";
      const d = parseDate(player.lastRelapseDate);
      if (!d) return "Datum unbekannt";
      const today = new Date();
      const daysAgo = daysBetween(d, today);
      const dateStr = d.toLocaleDateString();
      if (daysAgo === 0) return `Heute (${dateStr})`;
      if (daysAgo === 1) return `Gestern (${dateStr})`;
      return `${daysAgo} Tag(e) her (${dateStr})`;
    }

    function todayChecked(player) {
      return player.lastCheckDate === todayDateStr();
    }

    function updateStatus(connected) {
      const dot = document.getElementById("statusDot");
      const label = document.getElementById("statusLabel");
      if (!dot || !label) return;
      if (!connected) {
        dot.style.background = "#f97316";
        dot.style.boxShadow = "0 0 10px rgba(249,115,22,0.9)";
        label.textContent = "Verbinde…";
      } else {
        dot.style.background = "#22c55e";
        dot.style.boxShadow = "0 0 10px rgba(34,197,94,0.9)";
        label.textContent = "Live verbunden";
      }
    }

    function saveState() {
      if (!db || !hasInitialLoad) return;
      const ref = db.ref("nofapRooms/" + ROOM_ID);
      ref.set(state).catch(err => console.error("Fehler beim Speichern:", err));
    }

    function handleCheckClean(playerId) {
      const p = state.players[playerId];
      if (!p) return;
      const today = todayDateStr();

      if (!p.isOnStreak) {
        p.isOnStreak = true;
        p.streakStart = today;
      } else if (!p.streakStart) {
        p.streakStart = today;
      }

      p.lastCheckDate = today;
      saveState();
      renderAll();
    }

    function handleRelapse(playerId) {
      const p = state.players[playerId];
      if (!p) return;
      const today = todayDateStr();
      const reason = window.prompt(
        `Was war der Grund für den Rückfall bei ${p.name}? (optional)`,
        p.lastRelapseReason || ""
      );
      if (reason === null) return;

      let streakLen = 0;
      if (p.isOnStreak && p.streakStart) {
        const start = parseDate(p.streakStart);
        if (start) {
          const yesterday = new Date();
          yesterday.setDate(yesterday.getDate() - 1);
          streakLen = daysBetween(start, yesterday) + 1;
        }
      }
      if (streakLen > p.bestStreak) p.bestStreak = streakLen;

      p.isOnStreak = false;
      p.lastRelapseDate = today;
      p.lastRelapseReason = reason.trim();
      p.lastCheckDate = today;

      saveState();
      renderAll();
    }

    function handleNameChange(playerId, newName) {
      const p = state.players[playerId];
      if (!p) return;
      const trimmed = newName.trim();
      if (trimmed) p.name = trimmed;
      saveState();
      renderAll();
    }

    function handleResetAll() {
      if (!window.confirm("Wirklich alle Daten für euch beide zurücksetzen?")) return;
      state = defaultState();
      saveState();
      renderAll();
    }

    // Badges

    function getBadgesForPlayer(player) {
      const current = currentStreakDays(player);
      const best = player.bestStreak || 0;
      const result = [];

      BADGES.forEach(b => {
        let earned = false;
        if (b.type === "streak") {
          earned = current >= b.threshold;
        } else if (b.type === "best") {
          earned = best >= b.threshold;
        } else if (b.type === "bounce") {
          // z.B. nach einem Rückfall wieder min. 3 Tage geschafft
          if (player.lastRelapseDate && current >= 3) earned = true;
        }
        result.push({ ...b, earned });
      });

      return result;
    }

    // Rendering

    function renderSummary() {
      const overallContainer = document.getElementById("overallStats");
      const note = document.getElementById("summaryNote");
      const goalProgress = document.getElementById("goalProgress");
      if (!overallContainer || !note || !goalProgress) return;

      overallContainer.innerHTML = "";
      goalProgress.innerHTML = "";

      const players = Object.values(state.players || {});
      if (players.length === 0) return;

      // Übersicht pro Person
      players.forEach(p => {
        const current = currentStreakDays(p);
        const wrap = document.createElement("div");
        wrap.className = "overall-item";

        const label = document.createElement("div");
        label.className = "overall-label";
        label.textContent = p.name;

        const value = document.createElement("div");
        value.className = "overall-value";
        value.innerHTML = `<span class="highlight">${current}</span> Tage · Rekord ${p.bestStreak} Tage`;

        wrap.appendChild(label);
        wrap.appendChild(value);
        overallContainer.appendChild(wrap);
      });

      // Vergleich-Satz
      if (players.length === 2) {
        const [a, b] = players;
        const aStreak = currentStreakDays(a);
        const bStreak = currentStreakDays(b);
        const aBest = a.bestStreak || 0;
        const bBest = b.bestStreak || 0;
        let text = "";

        if (aStreak > bStreak) {
          text += `👑 Aktuell vorne: ${a.name} (${aStreak} vs. ${bStreak} Tage). `;
        } else if (bStreak > aStreak) {
          text += `👑 Aktuell vorne: ${b.name} (${bStreak} vs. ${aStreak} Tage). `;
        } else {
          text += `🤝 Gleichstand – beide ${aStreak} Tage. `;
        }

        if (aBest > bBest) {
          text += `Rekordhalter: ${a.name} mit ${aBest} Tagen.`;
        } else if (bBest > aBest) {
          text += `Rekordhalter: ${b.name} mit ${bBest} Tagen.`;
        } else {
          text += `Eure Rekorde sind gleich hoch (${aBest} Tage).`;
        }

        note.textContent = text;
      } else {
        note.textContent = "Checkt einfach jeden Tag einmal kurz ein. Konstanz > Perfektion.";
      }

      // 90-Tage-Balken pro Person
      players.forEach(p => {
        const current = currentStreakDays(p);
        const percent = Math.max(0, Math.min(100, (current / 90) * 100));

        const block = document.createElement("div");
        block.className = "overall-item";
        block.style.marginBottom = "0.4rem";

        const label = document.createElement("div");
        label.className = "overall-label";
        label.textContent = `${p.name} – ${current}/90 Tage`;

        const bar = document.createElement("div");
        bar.className = "progress-bar";
        const inner = document.createElement("div");
        inner.className = "progress-inner";
        inner.style.width = percent.toFixed(1) + "%";
        bar.appendChild(inner);

        block.appendChild(label);
        block.appendChild(bar);
        goalProgress.appendChild(block);
      });
    }

    function renderPlayers() {
      const container = document.getElementById("players");
      if (!container) return;
      container.innerHTML = "";

      const players = Object.values(state.players || {});
      players.forEach(p => {
        const current = currentStreakDays(p);

        const card = document.createElement("div");
        card.className = "player-card";

        const header = document.createElement("div");
        header.className = "player-header";

        const leftHeader = document.createElement("div");
        const name = document.createElement("div");
        name.className = "player-name";
        name.textContent = p.name;
        leftHeader.appendChild(name);

        const input = document.createElement("input");
        input.className = "name-input";
        input.value = p.name;
        input.placeholder = "Name ändern…";
        input.addEventListener("change", e => handleNameChange(p.id, e.target.value));
        leftHeader.appendChild(input);

        const chip = document.createElement("div");
        chip.className = "streak-chip " + (p.isOnStreak ? "on" : "off");
        const dot = document.createElement("span");
        dot.className = "dot";
        const label = document.createElement("span");
        label.textContent = p.isOnStreak ? "auf Streak" : "Reset – neuer Start";

        chip.appendChild(dot);
        chip.appendChild(label);

        header.appendChild(leftHeader);
        header.appendChild(chip);
        card.appendChild(header);

        const stat1 = document.createElement("div");
        stat1.className = "stat-row";
        stat1.innerHTML = `<div class="stat-label">Aktuelle Streak</div><div class="stat-value">${current} Tag(e)</div>`;
        card.appendChild(stat1);

        const stat2 = document.createElement("div");
        stat2.className = "stat-row";
        stat2.innerHTML = `<div class="stat-label">Bester Rekord</div><div class="stat-value">${p.bestStreak} Tag(e)</div>`;
        card.appendChild(stat2);

        const stat3 = document.createElement("div");
        stat3.className = "stat-row";
        stat3.innerHTML = `<div class="stat-label">Letzter Rückfall</div><div class="stat-value">${lastRelapseLabel(p)}</div>`;
        card.appendChild(stat3);

        const todayLine = document.createElement("div");
        todayLine.className = "today-status";
        todayLine.textContent = todayChecked(p) ? "Heute schon markiert ✅" : "Heute noch nicht markiert";
        card.appendChild(todayLine);

        const btnRow = document.createElement("div");
        btnRow.className = "btn-row";

        const btnClean = document.createElement("button");
        btnClean.className = "btn btn-clean";
        btnClean.textContent = "✅ Heute clean";
        btnClean.addEventListener("click", () => handleCheckClean(p.id));

        const btnRelapse = document.createElement("button");
        btnRelapse.className = "btn btn-relapse";
        btnRelapse.textContent = "💥 Heute Rückfall";
        btnRelapse.addEventListener("click", () => handleRelapse(p.id));

        btnRow.appendChild(btnClean);
        btnRow.appendChild(btnRelapse);
        card.appendChild(btnRow);

        // Badges
        const badgesWrap = document.createElement("div");
        badgesWrap.className = "badges-section";

        const badgesTitle = document.createElement("div");
        badgesTitle.className = "badges-title";
        badgesTitle.textContent = "Badges (Streak & Rekord)";
        badgesWrap.appendChild(badgesTitle);

        const badgesList = document.createElement("div");
        badgesList.className = "badges-list";

        const badges = getBadgesForPlayer(p);
        badges.forEach(b => {
          const pill = document.createElement("div");
          pill.className = "badge-pill " + (b.earned ? "earned" : "locked");
          const dotBadge = document.createElement("span");
          dotBadge.className = "dot";
          const txt = document.createElement("span");
          txt.textContent = b.label;
          pill.appendChild(dotBadge);
          pill.appendChild(txt);
          badgesList.appendChild(pill);
        });

        badgesWrap.appendChild(badgesList);
        card.appendChild(badgesWrap);

        // Rückfall-Notiz
        if (p.lastRelapseDate || p.lastRelapseReason) {
          const note = document.createElement("div");
          note.className = "relapse-note";
          const title = document.createElement("div");
          title.className = "relapse-note-title";
          title.textContent = "Notiz zum letzten Rückfall";
          const body = document.createElement("div");
          body.className = "relapse-note-body";
          body.textContent = p.lastRelapseReason || "Kein Grund eingetragen.";
          note.appendChild(title);
          note.appendChild(body);
          card.appendChild(note);
        }

        container.appendChild(card);
      });
    }

    function renderMeta() {
      const subtitle = document.getElementById("subtitle");
      const footer = document.getElementById("footer");
      const now = new Date();
      if (subtitle) {
        subtitle.textContent = `Stand: ${now.toLocaleString()}`;
      }
      if (footer) {
        footer.textContent = "Ziel: 90 Tage. Wenn ein Rückfall passiert: ruhig resetten und weiter machen.";
      }
    }

    function renderAll() {
      ensureStateShape();
      renderSummary();
      renderPlayers();
      renderMeta();
      updateStatus(hasInitialLoad);
    }

    function initFirebase() {
      try {
        firebase.initializeApp(firebaseConfig);
        db = firebase.database();
      } catch (e) {
        console.error("Firebase Init Fehler:", e);
        updateStatus(false);
        return;
      }

      const ref = db.ref("nofapRooms/" + ROOM_ID);
      ref.on(
        "value",
        snapshot => {
          if (!snapshot.exists()) {
            state = defaultState();
            ensureStateShape();
            hasInitialLoad = true;
            saveState();
            renderAll();
            return;
          }
          state = snapshot.val();
          ensureStateShape();
          hasInitialLoad = true;
          renderAll();
        },
        err => {
          console.error("Fehler beim Lesen von Firebase:", err);
          hasInitialLoad = false;
          updateStatus(false);
        }
      );
    }

    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("resetAll")?.addEventListener("click", handleResetAll);
      renderMeta();
      initFirebase();
    });
  </script>
</body>
</html>
